plugins {
  id 'java'
  alias(libs.plugins.jmh)
}

description 'A JMH benchmark to assert the overhead imposed by various types of BTrace instrumentation.'

def env = System.getenv()
def javaHome = env['JAVA_HOME']

dependencies {
  implementation project(path: ":btrace-dist", configuration: "shadow")
  implementation project(":btrace-compiler")
  jmh tasks.getByPath(':btrace-dist:btraceJar').outputs.getFiles()

  jmh libs.jmh
  jmh libs.jmh.annprocess
}

task btracec(type: JavaExec) {
  group 'Build'
  inputs.files 'src/main/resources/scripts'
  outputs.dir buildDir.toPath().resolve("classes/java/main")

  environment('BTRACE_HOME', "$projectDir")
  classpath configurations.runtimeClasspath
  mainClass = 'io.btrace.compiler.Compiler'
  args '-d'
  args "${buildDir}/classes/java/main/"
  args '-packext'
  args 'btclass'
  args fileTree(dir: "src/jmh/btrace", include: 'TraceScript.java')
}
compileJmhJava.dependsOn btracec
jmhClasses.dependsOn btracec

jmhJar {
  include 'META-INF/BenchmarkList'
  include 'META-INF/CompilerHints'
  include 'org/openjdk/jmh/**'
  include 'io/btrace/bench/**/*.class'
  include 'io/btrace/generated/**/*'
  include "joptsimple/**"
  include "org/apache/**"
  include 'jmh*'
  include 'benchmark/**'
  include '*.btclass'
}

jmh {
  warmupIterations = 5
  iterations = 10
  fork = 2
  jvm = "${env['JAVA_HOME']}/bin/java"
  duplicateClassesStrategy = DuplicatesStrategy.WARN
  def agentJarPath = tasks.getByPath(':btrace-dist:btraceJar').outputs.getFiles().getSingleFile()
  def scriptPath = buildDir.toPath().resolve('classes/java/main/TraceScript.btclass')
  // -Pbudget=<hits/s> appends probeMaxRate to the agent string. The benchmark script is a startup
  // script loaded at JVM launch, so its probe is exempt: neither counted nor removed.
  def budgetOption = project.hasProperty('budget') ? ",probeMaxRate=${project.property('budget')}" : ''
  def agent = "-javaagent:${agentJarPath}=stdout=false,noServer=true,debug=false,script=${scriptPath}${budgetOption}"
  def jvmArgs = ["-Djmh.basedir=${buildDir.getParentFile()}", "-Dproject.version=${project.version}", "-Xmx128m"]
  // The async-profiler agent is added only where its library exists.
  def asyncProfiler = new File('/tmp/libasyncProfiler.dylib')
  if (asyncProfiler.exists()) {
    jvmArgs << "-agentpath:${asyncProfiler}=start,event=cpu,jfr=7,file=/tmp/btrace.jfr".toString()
  }
  jvmArgs << agent.toString()
  jvmArgsAppend = jvmArgs
  // -PjmhIncludes=<regex>, -PjmhTimeUnit=<unit> and -PjmhProfilers=none narrow a run and make a
  // nanosecond-scale difference readable.
  includes = [project.findProperty('jmhIncludes') ?: '.*BTraceBench.*']
  profilers = project.findProperty('jmhProfilers') == 'none' ? [] : ['stack']
  if (project.hasProperty('jmhTimeUnit')) {
    timeUnit = project.property('jmhTimeUnit')
  }
}