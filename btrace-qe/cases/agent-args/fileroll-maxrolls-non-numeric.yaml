id: agent-args.fileroll-maxrolls-non-numeric
surface: agent-args
intent: resilience
title: "Agent started with fileRollMaxRolls=not-a-number"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${probeClassesDir}/io/btrace/qe/probe/QeStartupProbe.class,noServer=false,stdout=true,fileRollMaxRolls=not-a-number"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "fileRollMaxRolls"
