id: agent-args.fileroll-ms-negative
surface: agent-args
intent: resilience
tier: smoke
title: "Agent started with fileRollMilliseconds=-5"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${probeClassesDir}/io/btrace/qe/probe/QeStartupProbe.class,noServer=false,stdout=true,fileRollMilliseconds=-5"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "fileRollMilliseconds"
