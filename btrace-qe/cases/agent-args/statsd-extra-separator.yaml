id: agent-args.statsd-extra-separator
surface: agent-args
intent: resilience
title: "Agent started with statsd=localhost:8125:9 (extra ':' separator)"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${probeClassesDir}/io/btrace/qe/probe/QeStartupProbe.class,noServer=false,stdout=true,statsd=localhost:8125:9"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "statsd"
    - "localhost:8125:9"
