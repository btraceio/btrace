id: agent-args.unknown-option-typo
surface: agent-args
intent: resilience
title: "Agent started with a misspelled option (scriptOutputDri= instead of scriptOutputDir=)"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${probeClassesDir}/io/btrace/qe/probe/QeStartupProbe.class,noServer=false,stdout=true,scriptOutputDri=${runDir}/out"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "scriptOutputDri"
