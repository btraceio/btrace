id: agent-args.script-missing-file
surface: agent-args
intent: resilience
title: "Agent started with script= pointing at a file that does not exist"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${runDir}/no-such-probe.class,noServer=false,stdout=true"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "no-such-probe.class"
