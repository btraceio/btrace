id: agent-args.bind-address-non-loopback
surface: agent-args
intent: resilience
title: "Agent started with bindAddress=0.0.0.0"
given:
  mode: target
  target: SteadyStateTarget
  agentArgs: "script=${probeClassesDir}/io/btrace/qe/probe/QeStartupProbe.class,noServer=false,stdout=true,bindAddress=0.0.0.0"
steps:
  - launch
  - awaitReady
  - canary
  - shutdown
  - awaitExit
expect:
  messageMustMention:
    - "bindAddress"
    - "0.0.0.0"
