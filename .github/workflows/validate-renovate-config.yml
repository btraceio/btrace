name: Validate Renovate Config

on:
  push:
    branches: [ develop ]
    paths:
      - renovate.json
  pull_request:
    branches: [ develop ]
    paths:
      - renovate.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate renovate.json
        run: npx --yes --package renovate@39 -- renovate-config-validator
