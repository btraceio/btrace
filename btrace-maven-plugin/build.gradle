plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.btrace'
version = rootProject.version

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

description = 'BTrace Maven Plugin for building fat agent JARs with embedded extensions'

dependencies {
    // Maven Plugin API
    compileOnly 'org.apache.maven:maven-plugin-api:3.9.16'
    compileOnly 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.15.2'
    compileOnly 'org.apache.maven:maven-core:3.9.16'
    compileOnly 'org.apache.maven:maven-artifact:3.9.16'

    // Maven Resolver (Aether) for dependency resolution
    compileOnly 'org.apache.maven.resolver:maven-resolver-api:1.9.27'
    implementation 'org.apache.maven.resolver:maven-resolver-util:1.9.27'

    // JAR manipulation
    implementation 'org.codehaus.plexus:plexus-archiver:4.12.0'
    implementation 'org.codehaus.plexus:plexus-io:3.6.0'

    // Testing
    testImplementation libs.junit.jupiter
    testImplementation 'org.apache.maven:maven-plugin-api:3.9.16'
    testImplementation 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.15.2'
}

// Process the plugin.xml to substitute version (using @token@ format to avoid Maven expression conflicts)
processResources {
    filesMatching('META-INF/maven/plugin.xml') {
        filter { line ->
            line.replace('@VERSION@', project.version.toString())
        }
    }
}

// Publishing configuration for Maven plugin
publishing {
    publications {
        mavenPlugin(MavenPublication) {
            from components.java

            pom {
                name = 'BTrace Maven Plugin'
                description = project.description
                url = 'https://github.com/btraceio/btrace'
                packaging = 'maven-plugin'

                licenses {
                    license {
                        name = 'GPL-2.0 with Classpath Exception'
                        url = 'https://openjdk.org/legal/gplv2+ce.html'
                    }
                }

                developers {
                    developer {
                        id = 'btrace'
                        name = 'BTrace Project'
                        url = 'https://github.com/btraceio'
                    }
                }

                scm {
                    url = 'https://github.com/btraceio/btrace'
                    connection = 'scm:git:https://github.com/btraceio/btrace.git'
                    developerConnection = 'scm:git:ssh://git@github.com:btraceio/btrace.git'
                }
            }
        }
    }
}
