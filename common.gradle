//
// This file is to be applied to every subproject.
//

apply plugin: 'java'
apply plugin: 'idea'

project.group = 'org.openjdk.btrace'
project.version = '2.2.6'

buildscript {
    repositories {
        mavenCentral()
    }
}

// Define utility functions for tools.jar and other JDK tools
ext.getToolsJar = {
    return javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(11))
    }.get().metadata.installationPath.file("lib/tools.jar")
}

// Set source/target compatibility for all Java compilation
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = 8
    targetCompatibility = 8
    // Use Java 11 compiler for all compilation
    javaCompiler = javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(11))
    }
}

// Configure Javadoc tasks
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

repositories {
    mavenCentral()
    // You may define additional repositories, or even remove "mavenCentral()".
    // Read more about repositories here:
    //   http://www.gradle.org/docs/current/userguide/dependency_management.html#sec:repositories
}

dependencies {
    // Adding dependencies here will add the dependencies to each subproject.
	testImplementation libs.junit.jupiter
}

String mavenArtifactId = name

javadoc {
    // Use Java 8 toolchain for Javadoc generation
    javadocTool = javaToolchains.javadocToolFor {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    failOnError true
}

task sourcesJar(type: Jar, dependsOn: classes, description: 'Creates a jar from the source files.') {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives jar
    archives sourcesJar
    archives javadocJar
}

task createFolders(description: 'Creates the source folders if they do not exist.') doLast {
    sourceSets*.allSource*.srcDirs*.each { File srcDir ->
        if (!srcDir.isDirectory()) {
            println "Creating source folder: ${srcDir}"
            srcDir.mkdirs()
        }
    }
}

test {
    useJUnitPlatform()
    // Always run tests, even when nothing changed.
    dependsOn 'cleanTest'

    // Show test results.
    testLogging {
        events "passed", "skipped", "failed"
    }
}
