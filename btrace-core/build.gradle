import org.apache.tools.ant.filters.*

buildscript { scriptHandler ->
    apply from: rootProject.file('buildSrc/shared.gradle'), to: scriptHandler
}

plugins {
    alias(libs.plugins.jmh)
    id 'jacoco'
}

dependencies {
    implementation libs.slf4j
    implementation libs.slf4j.simple
    implementation libs.jctools
    implementation libs.asm
    implementation libs.asm.util

    jmh libs.jmh
    jmh libs.jmh.annprocess

    testImplementation platform(libs.junit)
    testImplementation libs.junit.jupiter
}

jmh {
    warmupIterations = 3
    iterations = 5
    fork = 2
    threads = 1
    timeUnit = 'ms'
    def jmhIncludeProp = project.findProperty('jmhInclude')
    includes = jmhIncludeProp ? [jmhIncludeProp] : ['.*BinaryProtocol.*']
    benchmarkMode = ['avgt', 'thrpt']
}

processResources {
    filter ReplaceTokens, tokens: [
        "btrace.version": project.version,
        "hash"          : getGitCommit()
    ]
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Focus on v2 protocol package
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, include: [
                '**/org/openjdk/btrace/core/comm/**/*.class'
            ])
        }))
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}
