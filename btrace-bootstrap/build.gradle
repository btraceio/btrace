plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

// Minimal bootstrap: only the three classes required by the INVOKEDYNAMIC dispatch mechanism.
// Probe classes are now defined in the agent classloader (MaskedClassLoader), so all other
// BTrace API types live in the masked agent section and are no longer bootstrap-visible.
def bootIncludes = {
    if (it.directory) return true
    if (it.path.endsWith('.jar')) return true
    // IndyDispatcher — bootstrap method for all INVOKEDYNAMIC probe/runtime dispatch
    if (it.path.startsWith('org/openjdk/btrace/indy/')) return true
    // LinkingFlag — re-entrancy guard used by IndyDispatcher and LinkerInstrumentor
    if (it.path.startsWith('org/openjdk/btrace/runtime/LinkingFlag')) return true
    // HandlerRepository — interface referenced directly by IndyDispatcher
    if (it.path == 'org/openjdk/btrace/core/HandlerRepository.class') return true
    // AnyType + its anonymous inner classes — GETSTATIC AnyType.VOID emitted into instrumented target classes
    if (it.path.startsWith('org/openjdk/btrace/core/types/AnyType')) return true
    // Service descriptors (text files, no classloader namespace impact)
    if (it.path.startsWith('META-INF/services')) {
        return !it.path.contains('com.sun.') && !it.path.contains('javax.annotation.')
    }
    return false
}

dependencies {
    implementation project(':btrace-core')
    implementation project(':btrace-runtime')
    implementation project(':btrace-instr')
    implementation project(':btrace-extension')
}

jar {
    enabled = false
}

shadowJar {
    archiveBaseName.set('btrace-bootstrap')
    archiveVersion.set('')
    archiveClassifier.set('')

    include bootIncludes

    configurations = [project.configurations.runtimeClasspath]
    relocate 'org.jctools', 'org.openjdk.btrace.libs.boot.org.jctools'
    relocate 'org.objectweb.asm', 'org.openjdk.btrace.libs.org.objectweb.asm'
    relocate 'org.slf4j', 'org.openjdk.btrace.libs.org.slf4j'
}

assemble.dependsOn shadowJar
