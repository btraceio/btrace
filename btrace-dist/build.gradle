buildZip.dependsOn agentJar, bootJar, clientJar, fixPermissions, copyDtraceLib, processResources, explodeExtensions
buildSdkmanZip.dependsOn agentJar, bootJar, clientJar, fixPermissions, copyDtraceLib, processResources, explodeExtensions
buildDeb.dependsOn agentJar, bootJar, clientJar, fixPermissions, copyDtraceLib, processResources, explodeExtensions
buildRpm.dependsOn agentJar, bootJar, clientJar, fixPermissions, copyDtraceLib, processResources, explodeExtensions
