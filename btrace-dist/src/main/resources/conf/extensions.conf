# BTrace Extension Configuration
#
# This file controls which extensions are loaded and how they behave.
# Configuration is read from (in priority order):
#   1. Command-line: -Dbtrace.extensions.config=/path/to/config
#   2. User config: ~/.btrace/extensions.conf
#   3. System config: $BTRACE_HOME/conf/extensions.conf
#
# Only the first file found is used (no merging).

# ============================================================================
# Extension Control
# ============================================================================

# extensions.enabled
# Whitelist of extension IDs to load (comma-separated).
# If empty or not set, all discovered extensions are enabled.
# If set, ONLY listed extensions will be loaded.
#
# Examples:
#   extensions.enabled=btrace-metrics
#   extensions.enabled=btrace-metrics,my-custom-extension
#
extensions.enabled=

# extensions.disabled
# Blacklist of extension IDs to prevent from loading (comma-separated).
# Takes precedence over extensions.enabled.
# Use this to selectively disable specific extensions.
#
# Examples:
#   extensions.disabled=btrace-old-version
#   extensions.disabled=extension-a,extension-b
#
extensions.disabled=

# extensions.autoload
# Control when extensions are loaded:
#   true  = Lazy loading (extensions loaded on demand when scripts use them)
#   false = Eager loading (all enabled extensions loaded at agent startup)
#
# Default: true
# Lazy loading reduces startup time and memory usage.
# Eager loading ensures all extensions are available immediately.
#
extensions.autoload=true

# ============================================================================
# Extension-Specific Settings
# ============================================================================

# Extension-specific properties use the format:
#   <extension-id>.<setting-name>=<value>
#
# These settings are passed to the extension when it's loaded.
# Check extension documentation for supported settings.

# Example: BTrace Metrics Extension Settings
# btrace-metrics.histogram.default-precision=3
# btrace-metrics.histogram.max-value=3600000000
# btrace-metrics.stats.window-size=1000

# Example: Custom Extension Settings
# my-extension.feature.enabled=true
# my-extension.endpoint=http://localhost:8080
# my-extension.timeout=5000
