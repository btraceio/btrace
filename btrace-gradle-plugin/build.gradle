import org.gradle.api.tasks.bundling.Jar

plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    // Shadow publishes only a Java 17 variant. Gradle 9, which Shadow requires, already runs on
    // Java 17+, so resolve it regardless of this plugin's own Java 11 bytecode target.
    disableAutoTargetJvm()
}

group = project.findProperty('GROUP') ?: (rootProject.group ?: 'io.btrace')
def requestedBTraceVersion = providers.gradleProperty('btraceVersion').orNull
version = requestedBTraceVersion ?: '0.0.0-local'

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    // This is an included build and cannot access the root version catalog, so the ASM version is
    // duplicated here. It must stay in sync with version('asm', ...) in the root settings.gradle;
    // AsmVersionSyncTest fails the build if the two drift apart.
    implementation 'org.ow2.asm:asm:9.11.1'
    implementation 'org.ow2.asm:asm-tree:9.11.1'
    // io.btrace.extension auto-applies com.gradleup.shadow by id. A plugin id only resolves when
    // its implementation is on the consumer's plugin classpath, so the plugin has to bring Shadow
    // with it; otherwise a build applying just id 'io.btrace.extension' cannot find it. Referenced
    // by id only, hence runtimeOnly. Keep in sync with plugin('shadow', ...) in the root
    // settings.gradle.
    runtimeOnly 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'

    // This is an included build and cannot access the root version catalog. Keep its tests on the
    // last Java 8-compatible JUnit line; the production plugin remains Java 11-compatible.
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Gradle 9 TestKit cannot start its nested build from a Java 11 test worker.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    useJUnitPlatform()
    // Gradle 9 TestKit launches nested builds and requires a Java 17+ runtime.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // AsmVersionSyncTest compares this build's hard-coded ASM version against the root version
    // catalog; hand it both files rather than let it guess from the working directory.
    systemProperty 'btrace.test.pluginBuildFile', file('build.gradle').absolutePath
    systemProperty 'btrace.test.rootSettingsFile', rootDir.parentFile.toPath().resolve('settings.gradle').toString()
}

gradlePlugin {
    website = 'https://github.com/btraceio/btrace'
    vcsUrl = 'https://github.com/btraceio/btrace.git'
    plugins {
        btraceExtension {
            id = 'io.btrace.extension'
            implementationClass = 'io.btrace.gradle.BTraceExtensionPlugin'
            displayName = 'BTrace Extension Plugin'
            description = 'Builds and packages BTrace extensions, scanning permissions and wiring manifests.'
        }
        btraceFatAgent {
            id = 'io.btrace.fat-agent'
            implementationClass = 'io.btrace.gradle.BTraceFatAgentPlugin'
            displayName = 'BTrace Fat Agent Plugin'
            description = 'Builds fat agent JARs with embedded extensions for single-JAR deployment.'
        }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

def validatePublicationVersion = {
    if (requestedBTraceVersion == null ||
            !(requestedBTraceVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
        throw new GradleException(
                'Publishing BTrace Gradle plugins requires -PbtraceVersion=<concrete X.Y.Z release version>.')
    }
}

// Maven local is not a release channel: also accept X.Y.Z-SNAPSHOT there, so a development build of
// the plugins can be staged for a local tutorial or demo run.
def validateLocalPublicationVersion = {
    if (requestedBTraceVersion == null ||
            !(requestedBTraceVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?/)) {
        throw new GradleException(
                'Publishing BTrace Gradle plugins to Maven local requires -PbtraceVersion=<X.Y.Z or X.Y.Z-SNAPSHOT>.')
    }
}

def signingKey = System.getenv('GPG_SIGNING_KEY')
def signingPassword = System.getenv('GPG_SIGNING_PWD')
if (signingKey != null && !signingKey.trim().isEmpty()) {
    signing {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications
    }
} else {
    tasks.matching { it.name.startsWith('sign') }.configureEach {
        onlyIf { false }
    }
}

tasks.matching { it.name.startsWith('publish') }.configureEach {
    doFirst(it.name.endsWith('ToMavenLocal') ? validateLocalPublicationVersion : validatePublicationVersion)
}

publishing {
    def publicationRepository = providers.gradleProperty('publicationRepository').orNull
    if (publicationRepository != null) {
        repositories {
            maven {
                name = 'external'
                url = uri(publicationRepository)
            }
        }
    }
    publications {
        // java-gradle-plugin will add pluginMaven and marker publications automatically.
        // This block allows publishing to local/remote Maven repositories.
        withType(MavenPublication) {
            pom {
                name = 'BTrace Gradle Extension Plugin'
                description = 'Gradle plugin for building BTrace extensions'
                url = 'https://github.com/btraceio/btrace'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'btrace'
                        name = 'BTrace Project'
                        url = 'https://github.com/btraceio'
                    }
                }
                scm {
                    url = 'https://github.com/btraceio/btrace'
                    connection = 'scm:git:https://github.com/btraceio/btrace.git'
                    developerConnection = 'scm:git:ssh://git@github.com:btraceio/btrace.git'
                }
            }
        }
    }
}
