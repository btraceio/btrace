plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

group = project.findProperty('GROUP') ?: (rootProject.group ?: 'io.btrace')
version = rootProject.version

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    // Match versions commonly cached in this repository to avoid extra fetches
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-tree:9.9.1'

    // This is an included build and cannot access the root version catalog. Keep its tests on the
    // last Java 8-compatible JUnit line; the production plugin remains Java 11-compatible.
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Gradle 9 TestKit cannot start its nested build from a Java 11 test worker.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        btraceExtension {
            id = 'io.btrace.extension'
            implementationClass = 'io.btrace.gradle.BTraceExtensionPlugin'
            displayName = 'BTrace Extension Plugin'
            description = 'Builds and packages BTrace extensions, scanning permissions and wiring manifests.'
        }
        btraceFatAgent {
            id = 'io.btrace.fat-agent'
            implementationClass = 'io.btrace.gradle.BTraceFatAgentPlugin'
            displayName = 'BTrace Fat Agent Plugin'
            description = 'Builds fat agent JARs with embedded extensions for single-JAR deployment.'
        }
    }
}

publishing {
    publications {
        // java-gradle-plugin will add pluginMaven and marker publications automatically.
        // This block allows publishing to local/remote Maven repositories.
        withType(MavenPublication) {
            pom {
                name = 'BTrace Gradle Extension Plugin'
                description = 'Gradle plugin for building BTrace extensions'
                url = 'https://github.com/btraceio/btrace'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'btrace'
                        name = 'BTrace Project'
                        url = 'https://github.com/btraceio'
                    }
                }
                scm {
                    url = 'https://github.com/btraceio/btrace'
                    connection = 'scm:git:https://github.com/btraceio/btrace.git'
                    developerConnection = 'scm:git:ssh://git@github.com:btraceio/btrace.git'
                }
            }
        }
    }
}
