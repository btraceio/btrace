plugins {
    id 'io.btrace.extension'
    alias(libs.plugins.shadow)
}

java {
    sourceCompatibility = 8
    targetCompatibility = 8
}

compileJava {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(11))
    }
}

btraceExtension {
    id = 'btrace-vibe-guard'
    name = 'BTrace Vibe Guard'
    description = 'Behavioral contracts and runtime validation for AI-generated code paths'
    services = ['io.btrace.vibeguard.VibeGuardService']
}

dependencies {
    apiCompileOnly 'org.jetbrains:annotations:26.1.0'
    apiCompileOnly project(':btrace-core')
    implCompileOnly 'org.jetbrains:annotations:26.1.0'
    implImplementation project(':btrace-core')

    testImplementation libs.junit.jupiter
}

test {
    useJUnitPlatform()
}
