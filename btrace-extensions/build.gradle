plugins {
    id 'base'
}

// Aggregate task to build API JARs of all contained extensions
tasks.register('buildExtensionsApi') {
    group = 'build'
    description = 'Build API JARs for all extensions in this composite project.'
}

// Wire all child projects that expose a buildApiJar task
gradle.projectsEvaluated {
    tasks.named('buildExtensionsApi').configure {
        subprojects.each { sp ->
            def apiTask = sp.tasks.findByName('buildApiJar')
            if (apiTask != null) {
                dependsOn(apiTask)
            }
        }
    }
}

